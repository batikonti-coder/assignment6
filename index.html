<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">Assignment 6</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Part 1</a></li>

        </div>

    <main class="container text-center">
        <h2 class="mb-4">Part 1: Getting Started with jQuery</h2>
        <div id="box-id" class="box-class p-3 mb-3 border">Element by ID & Class</div>
        <p>Element by Tag (p)</p>
        <button id="btn-change" class="btn btn-primary">Run Selectors & CSS</button>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            console.log("jQuery is ready!");

            $('#btn-change').click(function() {
                $('#box-id').text("Content changed with .text()");
                $('.box-class').html("<strong>Content changed with .html()</strong>");
                $('p').css({
                    "background-color": "yellow",
                    "font-size": "20px",
                    "padding": "10px"
                });
            });
        });
    </script>
</body>
