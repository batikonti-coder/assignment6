<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6 | Part 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .anim-box {
            width: 100px;
            height: 100px;
            background-color: #6f42c1;
            position: relative;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">Assignment 6</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Part 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="part2.html">Part 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="part3.html">Part 3</a></li>
                    <li class="nav-item"><a class="nav-link active" href="part4.html">Part 4</a></li>
                    <li class="nav-item"><a class="nav-link" href="part5.html">Part 5</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="row g-5">
            <div class="col-12">
                <h5>Task 8: Basic Animation</h5>
                <button id="btn-basic" class="btn btn-primary mb-3">Run Basic</button>
                <div id="box1" class="anim-box"></div>
            </div>
            <div class="col-12">
                <h5>Task 9: Sequential Animations</h5>
                <button id="btn-seq" class="btn btn-success mb-3">Run Sequential</button>
                <div id="box2" class="anim-box bg-success"></div>
            </div>
            <div class="col-12">
                <h5>Task 10: Combined Animation</h5>
                <button id="btn-comb" class="btn btn-warning mb-3">Run Combined</button>
                <div id="box3" class="anim-box bg-warning"></div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#btn-basic').click(function() {
                $('#box1').animate({
                    width: '200px',
                    left: '100px'
                }, 1000);
            });

            $('#btn-seq').click(function() {
                let box = $('#box2');
                box.animate({ left: '200px' }, 1000)
                   .animate({ top: '100px' }, 1000)
                   .animate({ width: '50px', height: '50px' }, 1000)
                   .animate({ left: '0px', top: '0px', width: '100px', height: '100px' }, 1000);
            });

            $('#btn-comb').click(function() {
                $('#box3').animate({
                    left: '250px',
                    opacity: '0.5',
                    width: '150px'
                }, 1500);
            });
        });
    </script>
</body>
</html>
