<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6 | Part 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">Assignment 6</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Part 1</a></li>
                    <li class="nav-item"><a class="nav-link active" href="part2.html">Part 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="part3.html">Part 3</a></li>
                    <li class="nav-item"><a class="nav-link" href="part4.html">Part 4</a></li>
                    <li class="nav-item"><a class="nav-link" href="part5.html">Part 5</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h5>Visibility</h5>
                    <p id="vis-text">This is a visibility paragraph.</p>
                    <div class="mt-auto">
                        <button id="btn-hide" class="btn btn-danger">Hide</button>
                        <button id="btn-show" class="btn btn-success">Show</button>
                        <button id="btn-toggle" class="btn btn-secondary">Toggle</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h5>Fade Methods</h5>
                    <img id="fade-img" src="https://via.placeholder.com/150" class="mb-3" alt="placeholder">
                    <div class="mt-auto">
                        <button id="btn-fadein" class="btn btn-success">Fade In</button>
                        <button id="btn-fadeout" class="btn btn-danger">Fade Out</button>
                        <button id="btn-fadetoggle" class="btn btn-secondary">Fade Toggle</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h5>Slide Methods</h5>
                    <div id="slide-panel" class="bg-info text-white p-3 mb-3">Collapsible Panel Content</div>
                    <div class="mt-auto">
                        <button id="btn-slideup" class="btn btn-danger">Slide Up</button>
                        <button id="btn-slidedown" class="btn btn-success">Slide Down</button>
                        <button id="btn-slidetoggle" class="btn btn-secondary">Slide Toggle</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#btn-hide').click(function() { $('#vis-text').hide(); });
            $('#btn-show').click(function() { $('#vis-text').show(); });
            $('#btn-toggle').click(function() { $('#vis-text').toggle(); });

            $('#btn-fadein').click(function() { $('#fade-img').fadeIn(); });
            $('#btn-fadeout').click(function() { $('#fade-img').fadeOut(); });
            $('#btn-fadetoggle').click(function() { $('#fade-img').fadeToggle(); });

            $('#btn-slideup').click(function() { $('#slide-panel').slideUp(); });
            $('#btn-slidedown').click(function() { $('#slide-panel').slideDown(); });
            $('#btn-slidetoggle').click(function() { $('#slide-panel').slideToggle(); });
        });
    </script>
</body>
</html>
